[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Transforme des vidéos YouTube longues en clips de 2 à 5 minutes et les publie."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2026.10",
    "anthropic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "Pillow>=10",
    "opencv-python-headless>=4.9",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
